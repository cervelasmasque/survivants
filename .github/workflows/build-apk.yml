name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparer le projet
        run: |
          mkdir -p www
          cp index.html www/index.html
          echo '{"name":"survivants-des-alpes","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.2","@capacitor/core":"^6.1.2"},"devDependencies":{"@capacitor/cli":"^6.1.2"}}' > package.json
          echo '{"appId":"ch.benjamin.survivantsdesalpes","appName":"Survivants des Alpes","webDir":"www","android":{"backgroundColor":"#0f0b1d"}}' > capacitor.config.json
          npm install
          npx cap add android
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Compiler
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: survivants-des-alpes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
